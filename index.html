<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拾荒技能</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 簡潔大方：深色底、單一金色重點、大量留白；單欄置中 */
  :root{
    --bg:#0d1017; --panel:#161b26; --line:#232a3a;
    --ink:#f2f4f8; --muted:#8b94a8; --gold:#f5c451; --slate:#2a3247;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink)}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    display:flex;justify-content:center;user-select:none;
    padding-block:clamp(28px,7vw,64px) 56px;
    padding-left:max(20px,env(safe-area-inset-left,0px));
    padding-right:max(20px,env(safe-area-inset-right,0px));
    background:radial-gradient(ellipse 700px 380px at 50% -10%,#1a2133,transparent 70%),var(--bg);
    background-color:var(--bg);
  }
  #fx{position:fixed;inset:0;pointer-events:none;z-index:5}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
  #flash.on{animation:flash-out .5s ease-out}
  @keyframes flash-out{0%{opacity:.28}100%{opacity:0}}

  .stage{width:100%;max-width:420px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:32px}

  header{text-align:center}
  h1{margin:0;font-size:clamp(28px,7vw,34px);font-weight:900;letter-spacing:.12em;text-wrap:balance}
  .tagline{margin:10px 0 0;font-size:14px;color:var(--muted);letter-spacing:.08em}

  /* 轉盤 */
  .dial-wrap{position:relative;width:min(76vw,300px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  canvas#dial{width:100%;height:100%}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--gold);z-index:3}
  .core{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:var(--bg);border:2px solid var(--line);
    display:grid;place-items:center;z-index:4;pointer-events:none;transition:border-color .3s,box-shadow .3s}
  .core::after{content:"";width:28%;aspect-ratio:1;border-radius:50%;background:var(--muted);transition:background .3s}
  .dial-wrap.charging .core::after{background:var(--gold);animation:blink .4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  .dial-wrap.result-win .core{border-color:var(--gold)}
  .dial-wrap.result-win .core::after{background:var(--gold)}
  .dial-wrap.result-lose .core::after{background:#6c7790}
  .dial-wrap.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* 按鈕 */
  .cta-row{display:flex;flex-direction:column;align-items:center;gap:12px}
  .cast-btn{font:inherit;font-size:18px;font-weight:700;letter-spacing:.3em;text-indent:.3em;padding:15px 52px;border:0;border-radius:999px;cursor:pointer;
    color:#1b1405;background:var(--gold);box-shadow:0 8px 24px rgba(245,196,81,.22);transition:transform .1s,box-shadow .1s,filter .15s}
  .cast-btn:hover:not(:disabled){filter:brightness(1.06)}
  .cast-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 3px 12px rgba(245,196,81,.2)}
  .cast-btn:disabled{background:var(--slate);color:var(--muted);box-shadow:none;cursor:wait}
  .cast-btn:focus-visible,.reset-link:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  .odds{font-size:13px;color:var(--muted);letter-spacing:.1em}

  /* 結果 */
  .result{width:100%;min-height:92px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .result .big{font-size:clamp(24px,6.5vw,30px);font-weight:900;line-height:1.2;text-wrap:balance}
  .result .sub{font-size:14px;color:var(--muted)}
  .result.idle .big{font-size:18px;font-weight:500;color:var(--muted)}
  .result.win .big{color:var(--gold);animation:rise .45s ease-out}
  .result.lose .big{color:#a9b3c9;animation:rise .45s ease-out}
  @keyframes rise{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}

  /* 統計 */
  .stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat{padding:16px 6px;text-align:center;min-width:0}
  .stat+.stat{border-left:1px solid var(--line)}
  .stat .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:24px;display:block}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;display:block}
  .hist{display:flex;gap:10px;justify-content:center;min-height:14px;flex-wrap:wrap}
  .hist span{width:12px;height:12px;border-radius:50%;background:var(--gold)}
  .hist span.l{background:transparent;border:2px solid #5b6680}
  .reset-link{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
  .reset-link:hover{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){
    .dial-wrap.charging .core::after,.dial-wrap.shake,.result .big{animation:none!important}
    canvas#dial{transition-duration:.6s!important}
  }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas><div id="flash" aria-hidden="true"></div>
<div class="stage">
  <header>
    <h1>拾荒技能</h1>
    <p class="tagline">發動成功 50%　·　發動失敗 50%</p>
  </header>

  <div class="dial-wrap" id="dialWrap">
    <canvas id="dial" width="640" height="640" role="img" aria-label="判定轉盤，50% 區域為發動成功並獲得垃圾，50% 區域為發動失敗"></canvas>
    <div class="pointer" aria-hidden="true"></div>
    <div class="core" aria-hidden="true"></div>
  </div>

  <div class="cta-row">
    <button class="cast-btn" id="castBtn">發動技能</button>
    <span class="odds">成功 50%　失敗 50%</span>
  </div>

  <div class="result idle" id="banner" role="status" aria-live="polite">
    <span class="big">技能待命中</span><span class="sub">按下「發動技能」進行判定</span>
  </div>

  <div class="stats">
    <div class="stat"><span class="num" id="statCasts">0</span><span class="lbl">發動次數</span></div>
    <div class="stat"><span class="num" id="statWins">0</span><span class="lbl">獲得垃圾次數</span></div>
    <div class="stat"><span class="num" id="statRate">—</span><span class="lbl">實際成功率</span></div>
  </div>
  <div class="hist" id="hist" aria-label="最近 10 次結果，實心為成功，空心為失敗"></div>
  <button class="reset-link" id="resetBtn">重設紀錄</button>
</div>

<script>
(function () {
  "use strict";

  var SUCCESS_DEG = 180;

  var canvas = document.getElementById("dial");
  var ctx = canvas.getContext("2d");
  var dialWrap = document.getElementById("dialWrap");
  var castBtn = document.getElementById("castBtn");
  var banner = document.getElementById("banner");
  var statCasts = document.getElementById("statCasts");
  var statWins = document.getElementById("statWins");
  var statRate = document.getElementById("statRate");
  var resetBtn = document.getElementById("resetBtn");

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var currentRotation = 0;
  var spinning = false;

  var STORE_KEY = "scavenger-skill-stats-v1";
  var stats = { casts: 0, wins: 0, hist: [] };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && typeof saved.casts === "number" && typeof saved.wins === "number") {
      stats = saved;
    }
  } catch (e) { /* storage unavailable, keep defaults */ }

  function saveStats() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(stats)); } catch (e) { /* ignore */ }
  }

  function renderStats() {
    statCasts.textContent = String(stats.casts);
    statWins.textContent = String(stats.wins);
    statRate.textContent = stats.casts > 0
      ? (100 * stats.wins / stats.casts).toFixed(1) + "%"
      : "—";
    document.getElementById("hist").innerHTML = (stats.hist || []).map(function (w) {
      return '<span class="' + (w ? "w" : "l") + '"></span>';
    }).join("");
  }

  function drawDial() {
    var dpr = window.devicePixelRatio || 1;
    var size = canvas.clientWidth || 300;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    var cx = size / 2, cy = size / 2;
    var rOuter = size / 2 - 4;
    var rInner = rOuter - size * 0.2;

    function ring(startDeg, endDeg, color) {
      var start = (-90 + startDeg) * Math.PI / 180;
      var end = (-90 + endDeg) * Math.PI / 180;
      ctx.beginPath();
      ctx.arc(cx, cy, rOuter, start, end);
      ctx.arc(cx, cy, rInner, end, start, true);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }
    ring(0, SUCCESS_DEG, "#f5c451");
    ring(SUCCESS_DEG, 360, "#2a3247");

    // 分隔縫
    ctx.save();
    ctx.strokeStyle = "#0d1017";
    ctx.lineWidth = 5;
    [0, SUCCESS_DEG].forEach(function (deg) {
      var a = (-90 + deg) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(cx + (rInner - 2) * Math.cos(a), cy + (rInner - 2) * Math.sin(a));
      ctx.lineTo(cx + (rOuter + 2) * Math.cos(a), cy + (rOuter + 2) * Math.sin(a));
      ctx.stroke();
    });
    ctx.restore();

    function label(text, midDeg, color) {
      var mid = (-90 + midDeg) * Math.PI / 180;
      var rr = (rInner + rOuter) / 2;
      ctx.save();
      ctx.translate(cx + rr * Math.cos(mid), cy + rr * Math.sin(mid));
      ctx.rotate(mid + Math.PI / 2);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      ctx.font = "700 " + Math.round(size * 0.065) + "px 'Noto Sans TC', sans-serif";
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }
    label("成功 50%", SUCCESS_DEG / 2, "#2b2105");
    label("失敗 50%", SUCCESS_DEG + (360 - SUCCESS_DEG) / 2, "#aeb8cf");
  }

  function isSuccessAtPointer(rotationDeg) {
    var rMod = ((rotationDeg % 360) + 360) % 360;
    var y = (360 - rMod) % 360;
    return y < SUCCESS_DEG;
  }

  function setBanner(state, big, sub) {
    banner.className = "result " + state;
    banner.innerHTML = '<span class="big">' + big + '</span><span class="sub">' + sub + '</span>';
  }

  /* ---------- 特效：輕量閃光與光點、音效（不影響判定結果） ---------- */
  var fx = document.getElementById("fx"), fctx = fx.getContext("2d");
  var flashEl = document.getElementById("flash");
  var particles = [], fxRunning = false, sprites = {};

  function sizeFx() { fx.width = window.innerWidth; fx.height = window.innerHeight; }
  sizeFx();
  window.addEventListener("resize", sizeFx);

  function sprite(color) {
    if (sprites[color]) return sprites[color];
    var s = document.createElement("canvas");
    s.width = s.height = 32;
    var g = s.getContext("2d"), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, "#fff"); gr.addColorStop(0.25, color); gr.addColorStop(1, "transparent");
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    return (sprites[color] = s);
  }
  function burst(x, y, n, color, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = Math.random() * power + 2;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: 1,
        decay: 0.012 + Math.random() * 0.015, size: Math.random() * 3 + 2.5,
        color: Math.random() < 0.6 ? color : "#ffffff" });
    }
    if (particles.length > 200) particles.splice(0, particles.length - 200);
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxTick); }
  }
  function fxTick() {
    fctx.clearRect(0, 0, fx.width, fx.height);
    fctx.globalCompositeOperation = "lighter";
    var j = 0;
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.99; p.life -= p.decay;
      if (p.life <= 0) continue;
      particles[j++] = p;
      fctx.globalAlpha = p.life;
      var d = p.size * 4;
      fctx.drawImage(sprite(p.color), p.x - d / 2, p.y - d / 2, d, d);
    }
    particles.length = j;
    if (j) requestAnimationFrame(fxTick);
    else { fxRunning = false; fctx.clearRect(0, 0, fx.width, fx.height); }
  }
  function flash() {
    flashEl.classList.remove("on"); void flashEl.offsetWidth; flashEl.classList.add("on");
  }

  var ac;
  function tone(f, t, d, type, v) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(v || 0.12, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + d);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + d);
    } catch (e) { /* audio unavailable */ }
  }
  function spinSound() {
    if (reduceMotion) return;
    for (var i = 0; i < 16; i++) {
      var u = i / 16;
      tone(520 - i * 12, 3.4 * (1 - Math.pow(1 - u, 2)), 0.05, "square", 0.03);
    }
  }
  function celebrate(success) {
    var r = dialWrap.getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    if (success) {
      [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.09, 0.3, "triangle", 0.13); });
    } else {
      tone(311, 0, 0.25, "triangle", 0.11); tone(233, 0.15, 0.4, "triangle", 0.11);
    }
    if (reduceMotion) return;
    if (success) {
      flash();
      burst(x, y, 36, "#f5c451", 8);
    } else {
      dialWrap.classList.remove("shake"); void dialWrap.offsetWidth; dialWrap.classList.add("shake");
    }
  }

  function cast() {
    if (spinning) return;
    spinning = true;
    castBtn.disabled = true;
    dialWrap.classList.remove("result-win", "result-lose");
    dialWrap.classList.add("charging");
    setBanner("idle", "判定中…", "技能能量正在匯聚");
    spinSound();

    var fullSpins = reduceMotion ? 2 : (4 + Math.floor(Math.random() * 3));
    var randomExtra = Math.random() * 360;
    var target = currentRotation + fullSpins * 360 + randomExtra;

    canvas.style.transition = "transform " + (reduceMotion ? "0.7s" : "3.6s") + " cubic-bezier(0.12, 0.7, 0.15, 1)";
    canvas.style.transform = "rotate(" + target + "deg)";

    var handled = false;
    function onDone() {
      if (handled) return;
      handled = true;
      canvas.removeEventListener("transitionend", onDone);
      currentRotation = target;

      var success = isSuccessAtPointer(currentRotation);

      stats.casts += 1;
      if (success) stats.wins += 1;
      stats.hist = (stats.hist || []);
      stats.hist.unshift(success ? 1 : 0);
      stats.hist = stats.hist.slice(0, 10);
      saveStats();
      renderStats();

      dialWrap.classList.remove("charging");
      dialWrap.classList.add(success ? "result-win" : "result-lose");

      if (success) {
        setBanner("win", "發動成功！獲得垃圾 x1", "你從技能中撿到了一堆沒人要的破爛");
      } else {
        setBanner("lose", "發動失敗…", "能量潰散,什麼都沒獲得");
      }
      celebrate(success);

      spinning = false;
      castBtn.disabled = false;
    }
    canvas.addEventListener("transitionend", onDone);
    setTimeout(onDone, (reduceMotion ? 800 : 3800));
  }

  resetBtn.addEventListener("click", function () {
    stats = { casts: 0, wins: 0, hist: [] };
    saveStats();
    renderStats();
    dialWrap.classList.remove("result-win", "result-lose");
    setBanner("idle", "紀錄已重設", "按下「發動技能」進行判定");
  });

  castBtn.addEventListener("click", cast);
  window.addEventListener("resize", drawDial);

  drawDial();
  renderStats();
})();
</script>
</body>
</html>
