<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拾荒技能</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 明亮版型：淡藍底、深藍文字、藍綠為主色、桃紅點綴、低彩度幾何背景；單欄置中 */
  :root{
    --bg:#F2F8FC; --navy:#152747; --teal:#007FA3; --pink:#ED5291; --pink-ink:#C2336F;
    --muted:#52627A; --card:#ffffff; --line:#D9E6F0; --teal-soft:#E1F1F7; --pink-soft:#FCE6EF;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background-color:var(--bg);color:var(--navy)}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    display:flex;justify-content:center;user-select:none;position:relative;overflow-x:hidden;
    padding-block:clamp(28px,7vw,60px) 56px;
    padding-left:max(20px,env(safe-area-inset-left,0px));
    padding-right:max(20px,env(safe-area-inset-right,0px));
  }
  /* 低彩度幾何背景 */
  .geo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .geo i{position:absolute;display:block}
  .geo .a{width:520px;height:520px;border-radius:50%;background:rgba(0,127,163,.08);left:-200px;top:-180px}
  .geo .b{width:360px;height:360px;border-radius:50%;background:rgba(237,82,145,.07);right:-140px;bottom:8%}
  .geo .c{width:220px;height:220px;border-radius:36px;background:rgba(21,39,71,.04);right:6%;top:9%;transform:rotate(16deg)}
  .geo .d{width:120px;height:120px;border-radius:50%;border:2px solid rgba(0,127,163,.18);left:7%;bottom:14%}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:5}
  #flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 38%,rgba(0,127,163,.28),transparent 62%);opacity:0;pointer-events:none;z-index:4}
  #flash.on{animation:flash-out .7s ease-out}
  @keyframes flash-out{0%{opacity:1}100%{opacity:0}}

  .stage{position:relative;z-index:1;width:100%;max-width:420px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:30px}

  header{text-align:center}
  .brand{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--teal);background:var(--teal-soft);padding:6px 14px;border-radius:999px;margin-bottom:14px}
  h1{margin:0;font-size:clamp(30px,8vw,38px);font-weight:900;letter-spacing:.1em;text-wrap:balance}
  .tagline{margin:10px 0 0;font-size:14px;color:var(--muted);letter-spacing:.06em}
  .tagline b{font-weight:700}
  .tagline .ok{color:var(--teal)}
  .tagline .ng{color:var(--pink-ink)}

  /* 轉盤 */
  .dial-wrap{position:relative;width:min(76vw,300px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .dial-wrap::before{content:"";position:absolute;inset:-5%;border-radius:50%;background:var(--card);box-shadow:0 18px 40px rgba(21,39,71,.14),0 0 0 1px var(--line)}
  canvas#dial{position:relative;width:100%;height:100%}
  .pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--navy);z-index:3;
    filter:drop-shadow(0 2px 3px rgba(21,39,71,.3))}
  .core{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:var(--card);border:3px solid var(--navy);
    display:grid;place-items:center;z-index:4;pointer-events:none;box-shadow:0 4px 10px rgba(21,39,71,.18);transition:border-color .3s}
  .core::after{content:"";width:30%;aspect-ratio:1;border-radius:50%;background:var(--navy);transition:background .3s}
  .dial-wrap.charging .core::after{animation:blink .4s ease-in-out infinite;background:var(--teal)}
  @keyframes blink{50%{opacity:.3}}
  .dial-wrap.result-win .core{border-color:var(--teal)}
  .dial-wrap.result-win .core::after{background:var(--teal)}
  .dial-wrap.result-lose .core{border-color:var(--pink)}
  .dial-wrap.result-lose .core::after{background:var(--pink)}
  .dial-wrap.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* 按鈕 */
  .cta-row{display:flex;flex-direction:column;align-items:center;gap:12px}
  .cast-btn{font:inherit;font-size:18px;font-weight:700;letter-spacing:.3em;text-indent:.3em;padding:15px 54px;border:0;border-radius:999px;cursor:pointer;
    color:#fff;background:var(--teal);box-shadow:0 10px 24px rgba(0,127,163,.3);transition:transform .1s,box-shadow .1s,filter .15s}
  .cast-btn:hover:not(:disabled){filter:brightness(1.07)}
  .cast-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 4px 12px rgba(0,127,163,.28)}
  .cast-btn:disabled{background:#B9C7D6;box-shadow:none;cursor:wait}
  .cast-btn:focus-visible,.reset-link:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
  .odds{font-size:13px;color:var(--muted);letter-spacing:.08em}

  /* 結果 */
  .result{width:100%;min-height:104px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;transition:background .3s,border-color .3s}
  .result .big{font-size:clamp(22px,6vw,27px);font-weight:900;line-height:1.25;text-wrap:balance}
  .result .sub{font-size:14px;color:var(--muted)}
  .result.idle .big{font-size:18px;font-weight:700;color:var(--muted)}
  .result.win{background:var(--teal-soft);border-color:rgba(0,127,163,.35)}
  .result.win .big{color:var(--teal);animation:rise .45s ease-out}
  .result.lose{background:var(--pink-soft);border-color:rgba(237,82,145,.35)}
  .result.lose .big{color:var(--pink-ink);animation:rise .45s ease-out}
  @keyframes rise{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}

  /* 統計 */
  .stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;min-width:0}
  .stat .num{font-variant-numeric:tabular-nums;font-weight:900;font-size:24px;display:block}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;display:block}
  .hist{display:flex;gap:10px;justify-content:center;min-height:14px;flex-wrap:wrap}
  .hist span{width:12px;height:12px;border-radius:50%;background:var(--teal)}
  .hist span.l{background:transparent;border:2px solid var(--pink)}
  .reset-link{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
  .reset-link:hover{color:var(--navy)}

  @media (prefers-reduced-motion:reduce){
    .dial-wrap.charging .core::after,.dial-wrap.shake,.result .big{animation:none!important}
    canvas#dial{transition-duration:.6s!important}
  }
</style>
</head>
<body>
<div class="geo" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
<canvas id="fx" aria-hidden="true"></canvas><div id="flash" aria-hidden="true"></div>
<div class="stage">
  <header>
    <span class="brand">SCAVENGER SKILL</span>
    <h1>拾荒技能</h1>
    <p class="tagline"><b class="ok">發動成功 50%</b>　·　<b class="ng">發動失敗 50%</b></p>
  </header>

  <div class="dial-wrap" id="dialWrap">
    <canvas id="dial" width="640" height="640" role="img" aria-label="判定轉盤，50% 區域為發動成功並獲得垃圾，50% 區域為發動失敗"></canvas>
    <div class="pointer" aria-hidden="true"></div>
    <div class="core" aria-hidden="true"></div>
  </div>

  <div class="cta-row">
    <button class="cast-btn" id="castBtn">發動技能</button>
    <span class="odds">成功 50%　失敗 50%</span>
  </div>

  <div class="result idle" id="banner" role="status" aria-live="polite">
    <span class="big">技能待命中</span><span class="sub">按下「發動技能」進行判定</span>
  </div>

  <div class="stats">
    <div class="stat"><span class="num" id="statCasts">0</span><span class="lbl">發動次數</span></div>
    <div class="stat"><span class="num" id="statWins">0</span><span class="lbl">獲得垃圾次數</span></div>
    <div class="stat"><span class="num" id="statRate">—</span><span class="lbl">實際成功率</span></div>
  </div>
  <div class="hist" id="hist" aria-label="最近 10 次結果，實心為成功，空心為失敗"></div>
  <button class="reset-link" id="resetBtn">重設紀錄</button>
</div>

<script>
(function () {
  "use strict";

  var SUCCESS_DEG = 180;

  var canvas = document.getElementById("dial");
  var ctx = canvas.getContext("2d");
  var dialWrap = document.getElementById("dialWrap");
  var castBtn = document.getElementById("castBtn");
  var banner = document.getElementById("banner");
  var statCasts = document.getElementById("statCasts");
  var statWins = document.getElementById("statWins");
  var statRate = document.getElementById("statRate");
  var resetBtn = document.getElementById("resetBtn");

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var currentRotation = 0;
  var spinning = false;

  var STORE_KEY = "scavenger-skill-stats-v1";
  var stats = { casts: 0, wins: 0, hist: [] };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && typeof saved.casts === "number" && typeof saved.wins === "number") {
      stats = saved;
    }
  } catch (e) { /* storage unavailable, keep defaults */ }

  function saveStats() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(stats)); } catch (e) { /* ignore */ }
  }

  function renderStats() {
    statCasts.textContent = String(stats.casts);
    statWins.textContent = String(stats.wins);
    statRate.textContent = stats.casts > 0
      ? (100 * stats.wins / stats.casts).toFixed(1) + "%"
      : "—";
    document.getElementById("hist").innerHTML = (stats.hist || []).map(function (w) {
      return '<span class="' + (w ? "w" : "l") + '"></span>';
    }).join("");
  }

  function drawDial() {
    var dpr = window.devicePixelRatio || 1;
    var size = canvas.clientWidth || 300;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    var cx = size / 2, cy = size / 2;
    var rOuter = size / 2 - 2;
    var rInner = rOuter - size * 0.22;

    function ring(startDeg, endDeg, color) {
      var start = (-90 + startDeg) * Math.PI / 180;
      var end = (-90 + endDeg) * Math.PI / 180;
      ctx.beginPath();
      ctx.arc(cx, cy, rOuter, start, end);
      ctx.arc(cx, cy, rInner, end, start, true);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }
    ring(0, SUCCESS_DEG, "#007FA3");
    ring(SUCCESS_DEG, 360, "#ED5291");

    // 白色分隔縫
    ctx.save();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;
    [0, SUCCESS_DEG].forEach(function (deg) {
      var a = (-90 + deg) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(cx + (rInner - 2) * Math.cos(a), cy + (rInner - 2) * Math.sin(a));
      ctx.lineTo(cx + (rOuter + 2) * Math.cos(a), cy + (rOuter + 2) * Math.sin(a));
      ctx.stroke();
    });
    ctx.restore();

    function label(text, midDeg) {
      var mid = (-90 + midDeg) * Math.PI / 180;
      var rr = (rInner + rOuter) / 2;
      ctx.save();
      ctx.translate(cx + rr * Math.cos(mid), cy + rr * Math.sin(mid));
      ctx.rotate(mid + Math.PI / 2);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 " + Math.round(size * 0.066) + "px 'Noto Sans TC', sans-serif";
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }
    label("成功 50%", SUCCESS_DEG / 2);
    label("失敗 50%", SUCCESS_DEG + (360 - SUCCESS_DEG) / 2);
  }

  function isSuccessAtPointer(rotationDeg) {
    var rMod = ((rotationDeg % 360) + 360) % 360;
    var y = (360 - rMod) % 360;
    return y < SUCCESS_DEG;
  }

  function setBanner(state, big, sub) {
    banner.className = "result " + state;
    banner.innerHTML = '<span class="big">' + big + '</span><span class="sub">' + sub + '</span>';
  }

  /* ---------- 特效：彩色紙屑、柔光、音效（不影響判定結果） ---------- */
  var fx = document.getElementById("fx"), fctx = fx.getContext("2d");
  var flashEl = document.getElementById("flash");
  var particles = [], fxRunning = false, sprites = {};

  function sizeFx() { fx.width = window.innerWidth; fx.height = window.innerHeight; }
  sizeFx();
  window.addEventListener("resize", sizeFx);

  // 預先畫好圓點，之後只用 drawImage，手機也不會卡
  function sprite(color) {
    if (sprites[color]) return sprites[color];
    var s = document.createElement("canvas");
    s.width = s.height = 24;
    var g = s.getContext("2d");
    g.fillStyle = color;
    g.beginPath(); g.arc(12, 12, 10, 0, Math.PI * 2); g.fill();
    return (sprites[color] = s);
  }
  function burst(x, y, n, colors, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = Math.random() * power + 2;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, life: 1,
        decay: 0.009 + Math.random() * 0.012, size: Math.random() * 6 + 5,
        color: colors[Math.floor(Math.random() * colors.length)] });
    }
    if (particles.length > 200) particles.splice(0, particles.length - 200);
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxTick); }
  }
  function fxTick() {
    fctx.clearRect(0, 0, fx.width, fx.height);
    var j = 0;
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.vx *= 0.985; p.life -= p.decay;
      if (p.life <= 0) continue;
      particles[j++] = p;
      fctx.globalAlpha = Math.min(1, p.life * 1.6);
      fctx.drawImage(sprite(p.color), p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    particles.length = j;
    if (j) requestAnimationFrame(fxTick);
    else { fxRunning = false; fctx.clearRect(0, 0, fx.width, fx.height); }
  }
  function flash() {
    flashEl.classList.remove("on"); void flashEl.offsetWidth; flashEl.classList.add("on");
  }

  var ac;
  function tone(f, t, d, type, v) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(v || 0.12, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + d);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + d);
    } catch (e) { /* audio unavailable */ }
  }
  function spinSound() {
    if (reduceMotion) return;
    for (var i = 0; i < 16; i++) {
      var u = i / 16;
      tone(520 - i * 12, 3.4 * (1 - Math.pow(1 - u, 2)), 0.05, "square", 0.03);
    }
  }
  function celebrate(success) {
    var r = dialWrap.getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    if (success) {
      [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.09, 0.3, "triangle", 0.13); });
    } else {
      tone(311, 0, 0.25, "triangle", 0.11); tone(233, 0.15, 0.4, "triangle", 0.11);
    }
    if (reduceMotion) return;
    if (success) {
      flash();
      burst(x, y, 56, ["#007FA3", "#ED5291", "#152747", "#7CCBE0"], 9);
    } else {
      burst(x, y, 16, ["#ED5291", "#F7A8C6"], 4);
      dialWrap.classList.remove("shake"); void dialWrap.offsetWidth; dialWrap.classList.add("shake");
    }
  }

  function cast() {
    if (spinning) return;
    spinning = true;
    castBtn.disabled = true;
    dialWrap.classList.remove("result-win", "result-lose");
    dialWrap.classList.add("charging");
    setBanner("idle", "判定中…", "技能能量正在匯聚");
    spinSound();

    var fullSpins = reduceMotion ? 2 : (4 + Math.floor(Math.random() * 3));
    var randomExtra = Math.random() * 360;
    var target = currentRotation + fullSpins * 360 + randomExtra;

    canvas.style.transition = "transform " + (reduceMotion ? "0.7s" : "3.6s") + " cubic-bezier(0.12, 0.7, 0.15, 1)";
    canvas.style.transform = "rotate(" + target + "deg)";

    var handled = false;
    function onDone() {
      if (handled) return;
      handled = true;
      canvas.removeEventListener("transitionend", onDone);
      currentRotation = target;

      var success = isSuccessAtPointer(currentRotation);

      stats.casts += 1;
      if (success) stats.wins += 1;
      stats.hist = (stats.hist || []);
      stats.hist.unshift(success ? 1 : 0);
      stats.hist = stats.hist.slice(0, 10);
      saveStats();
      renderStats();

      dialWrap.classList.remove("charging");
      dialWrap.classList.add(success ? "result-win" : "result-lose");

      if (success) {
        setBanner("win", "發動成功！獲得垃圾 x1", "你從技能中撿到了一堆沒人要的破爛");
      } else {
        setBanner("lose", "發動失敗…", "能量潰散,什麼都沒獲得");
      }
      celebrate(success);

      spinning = false;
      castBtn.disabled = false;
    }
    canvas.addEventListener("transitionend", onDone);
    setTimeout(onDone, (reduceMotion ? 800 : 3800));
  }

  resetBtn.addEventListener("click", function () {
    stats = { casts: 0, wins: 0, hist: [] };
    saveStats();
    renderStats();
    dialWrap.classList.remove("result-win", "result-lose");
    setBanner("idle", "紀錄已重設", "按下「發動技能」進行判定");
  });

  castBtn.addEventListener("click", cast);
  window.addEventListener("resize", drawDial);

  drawDial();
  renderStats();
})();
</script>
</body>
</html>
